name: Metrics
on:
  # 1st/11th/21st = 3 runs/month, ~every 10 days (cron cannot do exact 10-day intervals)
  schedule: [{cron: "59 23 1,11,21 * *"}]
  # Lines below let you run workflow manually and on each commit (optional)
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: [".github/workflows/**"]

jobs:

  achievements:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: achievements.svg
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B      # Display achievements with rank B or higher
          plugin_achievements_secrets: yes      # Display unlocked secrets achievements
          plugin_achievements_display: compact  # Use compact display
          plugin_achievements_limit: 0          # Display all unlocked achievements (no limit)

  github-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: header.svg
          # You'll need to setup a personal token in your secrets.
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          template: classic
          base: header
          config_timezone: ${{ secrets.USER_TIMEZONE }}
  lines:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: lines-of-code.svg
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          base: "repositories"
          plugin_lines: yes

  acti_comm:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: acti_comm.svg
          # You'll need to setup a personal token in your secrets.
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          template: classic
          base: activity, community
          config_timezone: ${{ secrets.USER_TIMEZONE }}

  iso_calender:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: iso_calender.svg
          # You'll need to setup a personal token in your secrets.
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  habits:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: github-habits.svg
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: ${{ secrets.USER_TIMEZONE }} # Set timezone
          base: ""
          template: classic
          plugin_habits: yes
          plugin_habits_from: 200       # Use 200 events to compute habits
          plugin_habits_days: 14        # Keep only events from last 14 days
          plugin_habits_charts: yes     # Display charts section
          plugin_habits_trim: yes       # Trim unused hours on daily chart

  issue_pr_lang:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: issue_pr_lang.svg
          # You'll need to setup a personal token in your secrets.
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_followup: yes
          plugin_languages: yes


  repositories:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: comdotlinux/metrics@bf2f1203ec9cbcc1fc40a281144bff9acb17c2ac # v3.36
        with:
          filename: repositories.svg
          # You'll need to setup a personal token in your secrets.
          token: |
            ${{ secrets.METRICS_SECRET }}
            ${{ secrets.METRICS_SECRET_WORK }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          template: classic
          base: repositories
          config_timezone: ${{ secrets.USER_TIMEZONE }}